apiVersion: v1
kind: Service
metadata:
  name: securegraph-backend
spec:
  selector:
    app: securegraph-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: securegraph-frontend
spec:
  selector:
    app: securegraph-frontend
  ports:
    - port: 5173
      targetPort: 5173
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
