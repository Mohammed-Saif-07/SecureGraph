apiVersion: v1
kind: ConfigMap
metadata:
  name: securegraph-config
data:
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  POSTGRES_URL: postgresql+psycopg://user:pass@postgres:5432/securegraph
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: http://localhost:5173
---
apiVersion: v1
kind: Secret
metadata:
  name: securegraph-secrets
type: Opaque
stringData:
  NEO4J_PASSWORD: password
  JWT_SECRET: change-me
  GROQ_API_KEY: ""
  GITHUB_TOKEN: ""
