apiVersion: apps/v1
kind: Deployment
metadata:
  name: securegraph-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: securegraph-backend
  template:
    metadata:
      labels:
        app: securegraph-backend
    spec:
      containers:
        - name: backend
          image: securegraph/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: securegraph-config
            - secretRef:
                name: securegraph-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securegraph-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securegraph-frontend
  template:
    metadata:
      labels:
        app: securegraph-frontend
    spec:
      containers:
        - name: frontend
          image: securegraph/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: http://localhost:8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: neo4j/password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: pass
            - name: POSTGRES_DB
              value: securegraph
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: securegraph-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: securegraph-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
